name: Windows portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build portable ZIP
        shell: pwsh
        run: |
          $result = 0
          try {
            & ./packaging/build-windows.ps1 *> build-output.txt
            if ($LASTEXITCODE -ne 0) { $result = 1 }
          } catch {
            $_ | Out-String | Add-Content build-output.txt
            $result = 1
          } finally {
            $tail = Get-Content build-output.txt -Tail 100 | Out-String
            Write-Output $tail
            if ($result -ne 0) {
              $diagnostic = $tail.Substring([Math]::Max(0, $tail.Length - 8000)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows build diagnostic::$diagnostic"
              '### Windows build failure' | Add-Content $env:GITHUB_STEP_SUMMARY
              '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
              $tail | Add-Content $env:GITHUB_STEP_SUMMARY
              '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }
          exit $result
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeSearch-windows-x64
          path: dist/ShakeSearch-windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @'
          Versione portatile per Windows 10/11 a 64 bit.

          Scarica ShakeSearch-windows-x64.zip, estrai tutta la cartella e avvia ShakeSearch.exe. Mantieni la cartella _internal accanto all'eseguibile.

          Python è incluso. È necessario Microsoft Edge WebView2 Runtime. Non serve una chiave API: ricerca e domande usano Google Lens.

          Terminale e finestra di stato visibili, configurazione al primo avvio, sensibilità del mouse regolabile e modalità di animazione leggera. Alt+F7 è stato rimosso. La finestra Lens si apre con le dimensioni della chat.

          Copia il testo direttamente dopo lo shake: l’overlay riconosce il testo localmente, permette di trascinare sulle lettere e copiarle con Ctrl+C o Copia testo. Non occorre aprire chat, lettore o Lens. Per cerchiare un’immagine partendo dal testo, disattiva Seleziona testo.

          La build verifica anche l’EXE compilato con OCR Windows reale, selezione nell’overlay e copia negli appunti.

          Build sperimentale non firmata.
          '@
          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          gh release create $env:RELEASE_TAG dist/ShakeSearch-windows-x64.zip --verify-tag --title "ShakeSearch $env:RELEASE_TAG — Windows portable" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
