name: Windows portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build portable ZIP
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeSearch-windows-x64
          path: dist/ShakeSearch-windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @'
          Versione portatile per Windows 10/11 a 64 bit.

          Scarica ShakeSearch-windows-x64.zip, estrai tutta la cartella e avvia ShakeSearch.exe. Mantieni la cartella _internal accanto all'eseguibile.

          Python è incluso. È necessario Microsoft Edge WebView2 Runtime. Non serve una chiave API: ricerca e domande usano Google Lens.

          Terminale e finestra di stato visibili, configurazione al primo avvio, sensibilità del mouse regolabile e modalità di animazione leggera. Alt+F7 è stato rimosso. La finestra Lens si apre con le dimensioni della chat.

          Seleziona le lettere direttamente sull’immagine trascinando il mouse, poi premi Ctrl+C o Copia testo. Il riquadro di testo separato è facoltativo. Copia testo dall’immagine con OCR locale di Windows: nessuna finestra Lens e nessun invio a Google per questa funzione. Richiede una lingua OCR installata. README aggiornato. Icona del logo inclusa nell’eseguibile e nelle finestre dell’app.

          Build sperimentale non firmata.
          '@
          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          gh release create $env:RELEASE_TAG dist/ShakeSearch-windows-x64.zip --verify-tag --title "ShakeSearch $env:RELEASE_TAG — Windows portable" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
