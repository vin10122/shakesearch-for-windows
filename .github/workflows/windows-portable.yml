name: Windows portable build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to update (for example v0.1.6); leave empty to build only'
        required: false
        type: string
  push:
    tags: ['v*']
    branches: ['release/v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build single-file EXE
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeSearch-windows-x64
          path: dist/ShakeSearch.exe
          if-no-files-found: error
      - name: Publish or update release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          UPDATE_EXISTING: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/v') }}
          GH_REPO: ${{ github.repository }}
        run: |
          $env:RELEASE_TAG = $env:RELEASE_TAG -replace '^release/', ''
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $notes = @'
          Versione portatile per Windows 10/11 a 64 bit.

          Scarica e avvia ShakeSearch.exe: un solo file, senza ZIP o cartella _internal da mantenere accanto. Le dipendenze vengono estratte in una cartella temporanea all'avvio, che può quindi richiedere più tempo.

          Python è incluso. È necessario Microsoft Edge WebView2 Runtime. Non serve una chiave API: ricerca e domande usano Google Lens.

          Alt+F7 attiva o disattiva solo gli shake, con notifica dello stato all'avvio e a ogni cambio. Quando gli shake sono disattivati, la Gaming mode evita interferenze mentre giochi con DPI alti. Seleziona area resta sempre disponibile. Lo stato viene salvato tra gli avvii. Le notifiche seguono le impostazioni di Windows e possono essere silenziate durante il gioco.

          Terminale e finestra di stato visibili, configurazione al primo avvio, sensibilità del mouse regolabile e modalità di animazione leggera. La finestra Lens si apre con le dimensioni della chat.

          La copia del testo dalle immagini arriverà presto. La funzione e il relativo pulsante sono stati rimossi da questa versione. Restano disponibili selezione e copia dell’immagine e ricerca con Google Lens.

          Build sperimentale non firmata.
          '@
          $notes += "`n`nBuild dal commit $env:GITHUB_SHA."
          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          if ($env:UPDATE_EXISTING -eq 'true') {
            gh release view $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Existing release not found' }
            gh release upload $env:RELEASE_TAG dist/ShakeSearch.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            gh release edit $env:RELEASE_TAG --title "ShakeSearch $env:RELEASE_TAG — Gaming mode / single EXE" --notes-file release-notes.txt
          } else {
            gh release create $env:RELEASE_TAG dist/ShakeSearch.exe --verify-tag --title "ShakeSearch $env:RELEASE_TAG — Gaming mode / single EXE" --notes-file release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
