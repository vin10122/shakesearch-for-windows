name: Windows portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build portable ZIP
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeSearch-windows-x64
          path: dist/ShakeSearch-windows-x64.zip
          if-no-files-found: error
